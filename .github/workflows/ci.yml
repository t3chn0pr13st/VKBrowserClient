name: ci

# ВНИМАНИЕ: автозапуск отключён намеренно. GitHub Actions у аккаунта не
# выполняются (биллинг), поэтому каждый push и каждый PR давали упавший ран,
# который ничего не проверял. Тесты гоняются локально перед выпуском —
# см. раздел о выпуске пакетов в документации репозитория.
# Если Actions заработают, верните триггеры `push:` и `pull_request:`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VKBrowserClient.slnx

      - name: Build (Release)
        run: dotnet build VKBrowserClient.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VKBrowserClient.slnx -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/VkBrowserClient/VkBrowserClient.csproj -c Release --no-build --no-restore -o artifacts
