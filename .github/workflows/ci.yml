name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VKBrowserClient.slnx

      - name: Build (Release)
        run: dotnet build VKBrowserClient.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VKBrowserClient.slnx -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/VkBrowserClient/VkBrowserClient.csproj -c Release --no-build --no-restore -o artifacts
