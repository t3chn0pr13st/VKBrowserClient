name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag and project version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(dotnet msbuild src/VkBrowserClient/VkBrowserClient.csproj -getProperty:Version -nologo)"
          [[ "$tag_version" == "$project_version" ]]

      - name: Build, test and pack
        run: |
          dotnet restore VKBrowserClient.slnx
          dotnet build VKBrowserClient.slnx --configuration Release --no-restore
          dotnet test VKBrowserClient.slnx --configuration Release --no-build --no-restore
          dotnet pack src/VkBrowserClient/VkBrowserClient.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/*.nupkg artifacts/*.snupkg
          --verify-tag
          --generate-notes
          --title "VKBrowserClient $GITHUB_REF_NAME"
