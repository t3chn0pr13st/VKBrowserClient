name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VKBrowserClient.slnx

      - name: Build (Release)
        run: dotnet build VKBrowserClient.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VKBrowserClient.slnx -c Release --no-build --no-restore
